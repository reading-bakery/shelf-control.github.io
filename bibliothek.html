<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothek - Shelf Control</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dosis:wght@200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style-site.css">  
    <link rel="stylesheet" href="navbar.css"> 
    <link rel="stylesheet" href="bibliothek.css"> 

    <script src="toggle.js" defer></script>
    <script src="backtop.js" defer></script>
    <script src="bibliothek.js" defer></script>
</head>
<body>

    <nav class="navbar"> 
        <div class="box1">
            <a href="index.html" class="logohome">Shelf Control</a>
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a href="currently.html">Currently</a></li> 
            <li><a href="wishlist.html">Wunschliste</a></li>
            <li><a href="rachesub.html">SuB</a></li>
            <li><a href="lesemonate.html">Lesemonate</a></li>
            <li><a href="challenges.html">Challenges</a></li>
            <li><a href="recap.html">Statistik</a></li>
            <li><a href="lieblinge.html">Favoriten</a></li>
            <li><a href="https://docs.google.com/spreadsheets/d/1Y6q--ao9QaY13fZSiIqNjPiOkYQiaQHdggKl0b_VaHE/edit?gid=1702643479#gid=1702643479" target="_blank">Lager</a></li>
            <li><a href="addnewbook.html">Add Book</a></li>
        </ul>
        <div class="toggle-button" id="toggle-button">
            <span id="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </span>
            <svg id="close-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
            </svg>
        </div>
    </nav>

    <h2>Bibliothek</h2>
    <main class="library-container">
        
        <!-- Steuerungsbereich: Tabs & Suchleiste -->
        <div class="filter-container">
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">Alle Bücher</button>
                <button class="tab-btn" data-filter="Print">Physisch</button>
                <button class="tab-btn" data-filter="eBook">E-Books</button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Nach Buchtitel oder Autor suchen..." autocomplete="off">
            </div>
        </div>

        <!-- Container für das Regalsystem -->
        <div class="bookshelf-wrapper" id="bookshelfWrapper">
            <!-- Wird per JS dynamisch befüllt -->
        </div>
    </main>

    <!-- Detail Modal Pop-up -->
    <div id="bookModal" class="book-modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modalCover" src="" alt="Cover">
            <div class="modal-info">
                <h3 id="modalTitle">Buchtitel</h3>
                <p><strong>Format:</strong> <span id="modalFormat"></span></p>
                <p><strong>Inhaltsangabe:</strong> <span id="modalDesc">Noch keine Inhaltsangabe hinterlegt.</span></p>
                <div class="modal-notes">
                    <label for="personalNotes"><strong>Persönliche Notizen:</strong></label>
                    <textarea id="personalNotes" placeholder="Notizen zum Buch eintragen..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="top-button">
        <button id="backToTop" aria-label="Nach oben">
            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" class="bi bi-arrow-bar-up" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 10a.5.5 0 0 0 .5-.5V3.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 3.707V9.5a.5.5 0 0 1 .5.5m-7 2.5a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 0 1h-13a.5.5 0 0 1-.5-.5"/>
            </svg>
        </button>
    </div>

    <footer>
        <p>&copy; 2026 Katharina | Impressum</p>
    </footer>

</body>
</html>
